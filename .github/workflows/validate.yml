name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies on purpose: the validator is stdlib-only so this job cannot fail
      # because a package index was slow. A red badge here must mean the index is wrong.
      - name: Cross-file consistency
        run: python scripts/validate_index.py

  signature:
    # The catalogue decides what a bot can install. Its digest chain makes a swapped
    # *download* fail; this job is what makes a swapped *catalogue* detectable at all.
    # It also fails when the JSON changed without re-signing, which is the only way the
    # signature stays meaningful.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The only job here with a dependency: Ed25519 verification is not in the stdlib.
      # Pinned like every other runtime pin in the two repositories.
      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.2"
      - name: Index signature
        run: python scripts/verify_index_signature.py .

  code:
    # `index` proves the files agree with each other. This proves the *change* is safe:
    # rewriting a published digest, pointing `download` at another repository, or
    # deleting a block entry all leave a perfectly consistent index. Only a comparison
    # against the base commit can see them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base commit must be present, or the change rules are skipped
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same constraint as `index`: stdlib only, so a red badge means the index is wrong.
      - name: Rule self-test
        run: python scripts/check_index_integrity.py --self-test
      - name: Index change integrity
        env:
          # pull_request carries base.sha; a push to main carries before.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_index_integrity.py --base "$BASE_SHA"
