name: weather-alert
version: 0.1.1
entry: main:WeatherAlertPlugin
description: 把中央气象台预警变成待说队列。改编自 not-zai 的 weather-watch。只向 nmc.cn 的 findAlarm 与 open-meteo 两个公开端点发 GET，不带凭据；预警经命令返回或 send 发到配置会话；已播报标题存加密 storage 去重（上限 200），weather-clear 可清空。
author: soapbot-plugins
trust: community
channel: community
min_host_version: 0.1.0
capabilities:
  - command
  - http
  - cron
  - storage
  - send
