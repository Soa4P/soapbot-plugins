name: mood-diary
version: 0.1.0
entry: main:MoodDiaryPlugin
description: 心情日记：每晚由当日交互统计推出基调（开心/热闹/平静/想念），写进插件加密 storage 的时间线；/mood 查看最近七天，纪念日当天主动一句。改编自 dsh-feiyu-mood 与 private_companion 的「每日反思/纪念日」，走 soapbot 自己的路——心情是事后日记，不进 prompt 权威（宿主温度管关系亲疏，这里管当日热闹程度），无模型调用，判断标准硬编码。
author: soapbot-plugins
trust: community
channel: community
min_host_version: 0.1.0
capabilities:
  - command
  - message
  - cron
  - storage
  - send
